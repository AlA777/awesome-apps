name: Update Awesome Apps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-awesome-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README and apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AlA777
        run: |
          cat > generate_site_data.py << 'PY'
          import json
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          USERNAME = "AlA777"
          CONFIG_FILE = Path("categories.yml")
          FALLBACK_CATEGORY = "Other Interesting Tools"
          SITE_URL = "https://ala777.github.io/awesome-apps/"

          def parse_categories(path):
              categories = {}
              current = None
              if not path.exists():
                  return categories
              for raw_line in path.read_text(encoding="utf-8").splitlines():
                  line = raw_line.rstrip()
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      continue
                  if not line.startswith(" ") and stripped.endswith(":"):
                      current = stripped[:-1].strip().strip('"\'')
                      categories[current] = []
                      continue
                  if current and stripped.startswith("-"):
                      keyword = stripped[1:].strip().strip('"\'')
                      if keyword:
                          categories[current].append(keyword.lower())
              return categories

          def slugify(text):
              text = text.lower().replace("/", " ")
              text = re.sub(r"[^a-z0-9]+", "-", text)
              return text.strip("-")

          def gh_api(path):
              result = subprocess.check_output(["gh", "api", "--paginate", path], text=True)
              chunks = []
              decoder = json.JSONDecoder()
              idx = 0
              while idx < len(result):
                  while idx < len(result) and result[idx].isspace():
                      idx += 1
                  if idx >= len(result):
                      break
                  obj, end = decoder.raw_decode(result, idx)
                  chunks.extend(obj if isinstance(obj, list) else [obj])
                  idx = end
              return chunks

          categories = parse_categories(CONFIG_FILE)
          repos = gh_api(f"users/{USERNAME}/starred")
          bucketed = {name: [] for name in categories}
          bucketed[FALLBACK_CATEGORY] = []
          apps = []

          for repo in repos:
              name = repo.get("full_name", "")
              desc = repo.get("description") or ""
              topics = repo.get("topics") or []
              language = repo.get("language") or "Unknown"
              text = f"{name} {desc} {' '.join(topics)} {language}".lower()
              category = FALLBACK_CATEGORY
              for cat, keywords in categories.items():
                  if any(keyword in text for keyword in keywords):
                      category = cat
                      break
              item = {
                  "name": name,
                  "url": repo.get("html_url", ""),
                  "description": desc or "No description",
                  "stars": repo.get("stargazers_count", 0),
                  "language": language,
                  "category": category,
                  "topics": topics,
                  "updated_at": repo.get("updated_at", ""),
              }
              apps.append(item)
              bucketed.setdefault(category, []).append(item)

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          Path("apps.json").write_text(json.dumps(apps, ensure_ascii=False, indent=2), encoding="utf-8")

          lines = [
              "# Awesome Apps",
              "",
              "> Automaticky generovaný katalog zajímavých aplikací, nástrojů a repozitářů.",
              "",
              f"🌐 Cyberdeck web: **[{SITE_URL}]({SITE_URL})**",
              "",
              f"Last update: **{now}**",
              "",
              "## Categories",
              "",
          ]
          for category, repos_in_category in bucketed.items():
              if repos_in_category:
                  lines.append(f"- [{category}](#{slugify(category)}) — {len(repos_in_category)}")
          lines.append("")
          for category, repos_in_category in bucketed.items():
              if not repos_in_category:
                  continue
              lines.append(f"## {category}")
              lines.append("")
              for app in sorted(repos_in_category, key=lambda r: r.get("name", "").lower()):
                  topic_text = ""
                  if app["topics"]:
                      topic_text = " — `" + "`, `".join(app["topics"][:6]) + "`"
                  lines.append(f"- [{app['name']}]({app['url']}) — {app['description']} ⭐ {app['stars']} — `{app['language']}`{topic_text}")
              lines.append("")
          Path("README.md").write_text("\n".join(lines).strip() + "\n", encoding="utf-8")
          PY
          python3 generate_site_data.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md apps.json
          git diff --cached --quiet || git commit -m "Update awesome apps catalog"
          git push
